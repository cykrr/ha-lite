 [package]
name = "ha-lite"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
dotenv = "0.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
btleplug = "0.13.5"
futures = "0.3.34"

[[bin]]
name="ha-lite"
path="src/main.rs"
